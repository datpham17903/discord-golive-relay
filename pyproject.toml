[project]
name = "discord-golive-relay"
version = "0.1.0"
description = "Relay one consenting user's Discord Go Live to one or more relay accounts: watch once, encode once, publish many times"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "datpham17903"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.12"
# discord.py-self is pinned by git commit and discord-native-voice is installed
# with --no-deps; see manifests/build-manifest.json and manifests/requirements.lock.txt.
dependencies = [
    "av==19.0.2",
    "PyYAML>=6,<7",
    # discord-native-voice 0.1.1 cannot decrypt DAVE media with davey 0.2.x (live: packets arrive,
    # no frame is ever assembled); discord.py-self[voice] would otherwise pull the newest davey.
    "davey==0.1.7",
    "discord-protos==1.2.399",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/datpham17903/discord-golive-relay"
Repository = "https://github.com/datpham17903/discord-golive-relay"

[project.scripts]
relayctl = "golive_relay.control.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
