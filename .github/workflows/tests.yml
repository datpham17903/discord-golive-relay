name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libopus0
      - name: Install pinned stack
        # discord.py-self is pinned by commit; discord-native-voice requires discord.py-self>=2.2.0,
        # which the pinned 2.2.0a pre-release does not satisfy, so it is installed without deps.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "discord.py-self[voice] @ git+https://github.com/dolfies/discord.py-self@2ba64a9a997e151a9c259984e0a179b1fdf4aff4"
          python -m pip install --no-deps discord-native-voice==0.1.1
          python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest -q
